name: Node.js CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest]
        node-version: [20.x, 22.x, 24.x]

    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        persist-credentials: false
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        node-version: ${{ matrix.node-version }}
    - run: yarn install
    - run: yarn check
    - run: yarn format
    - run: yarn test:ci
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      if: matrix.node-version == '24.x'
      with:
        name: reports-${{ matrix.os }}-${{ matrix.node-version }}
        retention-days: 1
        path: |
          **/coverage/lcov.info
          **/coverage/sonar-report.xml
          !node_modules/**

  # ─── Job 2: uploads to SonarCloud using secrets ─────────────────────────
  # Only runs for pushes and PRs from branches of this repository, never for forks
  # or dependency bots (Dependabot has no access to Actions secrets)
  static_analysis:
    name: "🔬 Static Analysis"
    needs: build
    runs-on: ubuntu-latest
    if: >-
      success() && (
        github.event_name == 'push' || (
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.user.login != 'dependabot[bot]' &&
          github.event.pull_request.user.login != 'renovate[bot]'
        )
      )
    permissions:
      contents: read
    steps:
    # Commit is needed to check coverage files against content
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        persist-credentials: false
        # Disabling shallow clone is needed by SonarQube
        fetch-depth: 0
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
      with:
        pattern: reports-*
        path: __reports
    - run: find __reports -type f
    - name: Collect Sonar report paths
      id: sonar_reports
      run: |
        test_reports=$(find __reports -name "sonar-report.xml" | sort | paste -sd, -)
        # The scanner action splits args on whitespace, only allow plain paths
        if [[ ! "$test_reports" =~ ^[A-Za-z0-9._/,-]+$ ]]; then
          echo "::error::Unexpected test report paths: $test_reports"
          exit 1
        fi
        echo "test_reports=$test_reports" >> "$GITHUB_OUTPUT"
        echo "project_version=$(git tag -l --sort=-creatordate --format='%(refname:short)' | head -n1)" >> "$GITHUB_OUTPUT"
    - name: SonarCloud Scan
      uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      with:
        args: >
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.testExecutionReportPaths=${{ steps.sonar_reports.outputs.test_reports }}
          -Dsonar.projectVersion=${{ steps.sonar_reports.outputs.project_version }}
